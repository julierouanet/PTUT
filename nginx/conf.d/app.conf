# ────────────────────────────────────────────────────────────
# app.lucaslopvet.fr  →  Flutter web (production)
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.lucaslopvet.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.lucaslopvet.fr;

    ssl_certificate     /etc/letsencrypt/live/app.lucaslopvet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.lucaslopvet.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/flutter-app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets Flutter
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
