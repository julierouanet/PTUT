# ────────────────────────────────────────────────────────────
# keycloak.lucaslopvet.fr  →  Keycloak (production, port 8080)
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name keycloak.lucaslopvet.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name keycloak.lucaslopvet.fr;

    ssl_certificate     /etc/letsencrypt/live/keycloak.lucaslopvet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keycloak.lucaslopvet.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Keycloak génère de grands headers (tokens JWT) — augmenter les buffers
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    location / {
        proxy_pass         http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  443;
    }
}
