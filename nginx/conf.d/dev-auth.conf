# ────────────────────────────────────────────────────────────
# dev.auth.lucaslopvet.fr  →  auth-service (dev, port 3003)
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name dev.auth.lucaslopvet.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.auth.lucaslopvet.fr;

    ssl_certificate     /etc/letsencrypt/live/dev.auth.lucaslopvet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.auth.lucaslopvet.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
