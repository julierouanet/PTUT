# ============================================================
# Nginx — déploiement IP-only (HTTPS self-signed)
# Routing par chemin : /auth/ → auth-service, /db/ → db-service,
#                      /keycloak/ → Keycloak, /app_isis/ → Flutter web
# ============================================================

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Compression bundle web (JS + WASM = ~96% du volume du 1er accès) ────
    # L'API (/auth/, /db/) est compressée côté Express (middleware `compression`),
    # pas ici, pour éviter une double compression.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm application/json text/css text/plain image/svg+xml;

    # ── Auth service (/auth/ → auth-service:3001/) ──────────
    location /auth/ {
        proxy_pass         http://auth-service:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── DB service (/db/ → db-service:3002/) ────────────────
    location /db/ {
        proxy_pass         http://db-service:3002/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── Keycloak (/keycloak/ → keycloak:8080/keycloak/) ─────
    # KC_HTTP_RELATIVE_PATH=/keycloak doit être défini sur le conteneur Keycloak
    location /keycloak/ {
        proxy_pass              http://keycloak:8080/keycloak/;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_set_header        X-Forwarded-Port  443;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout      90s;
    }

    # ── Certificat CA téléchargeable — MIME dédié pour Android/iOS ──
    # location exacte (priorité sur les regex et les prefixes) ; surtout PAS de
    # bloc `types {}` dans /setup/ : il écraserait la table MIME héritée et
    # servirait index.html en octet-stream.
    location = /setup/kabutare-ca.crt {
        root         /usr/share/nginx/html;
        default_type application/x-x509-ca-cert;
    }

    # ── Page d'installation PWA (publique, statique) ──
    location /setup/ {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # ── Redirection racine et /app_isis sans slash ────────────
    location = / {
        return 301 /app_isis/;
    }
    location = /app_isis {
        return 301 /app_isis/;
    }

    # ── Assets Flutter servis à la racine (fallback base href = /) ───────────
    location / {
        root      /usr/share/nginx/html;
        try_files $uri @flutter_root_fallback;
    }
    location @flutter_root_fallback {
        root      /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # ── Fichiers Flutter à noms FIXES — jamais mis en cache long ──────────────
    # Ces fichiers changent à chaque build mais gardent toujours le même nom :
    # no-cache (revalidation), PAS no-store, pour qu'un déploiement soit pris
    # en compte sans re-télécharger l'intégralité du bundle à chaque visite.
    # (?:app_isis/)? : le service worker est aussi enregistré à la RACINE
    # (/flutter_service_worker.js, cf. index.html) — même règle no-cache,
    # sinon la mise à jour silencieuse n'est pas garantie sur ce chemin.
    location ~* ^/(?:app_isis/)?(flutter_service_worker\.js|flutter_bootstrap\.js|flutter\.js|main\.dart\.js)$ {
        root       /usr/share/nginx/html;
        try_files  /$1 =404;
        add_header Cache-Control "no-cache";
    }

    # ── Assets réellement immuables (CanvasKit, polices/manifests) — cache 1 an ──
    # Doit être avant location /app_isis/ pour prendre priorité. Restreint à
    # /canvaskit/ et /assets/ : ce sont les seuls fichiers jamais réutilisés
    # sous un même nom après changement de contenu.
    location ~* ^/app_isis/(canvaskit/.+|assets/.+)$ {
        root       /usr/share/nginx/html;
        try_files  /$1 =404;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Flutter web app (/app_isis/) ─────────────────────────
    location /app_isis/ {
        alias      /usr/share/nginx/html/;
        try_files  $uri $uri/ @flutter_fallback;
        add_header Cache-Control "no-cache";
    }

    # ── Fallback SPA (routes Flutter internes) ────────────────
    location @flutter_fallback {
        root       /usr/share/nginx/html;
        try_files  /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Taille max upload — couvre le pire cas Multer : /documents accepte
    # jusqu'à 5 fichiers × 10 Mo (photoUpload/documentUpload dans
    # db-service/src/middleware/upload.js), soit 50 Mo en une requête.
    client_max_body_size 60M;
}
