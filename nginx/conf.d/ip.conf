# ============================================================
# Nginx — déploiement IP-only (HTTPS self-signed)
# Routing par chemin : /auth/ → auth-service, /db/ → db-service,
#                      /keycloak/ → Keycloak, / → Flutter web
# ============================================================

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Auth service (/auth/ → auth-service:3001/) ──────────
    location /auth/ {
        proxy_pass         http://auth-service:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── DB service (/db/ → db-service:3002/) ────────────────
    location /db/ {
        proxy_pass         http://db-service:3002/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── Keycloak (/keycloak/ → keycloak:8080/keycloak/) ─────
    # KC_HTTP_RELATIVE_PATH=/keycloak doit être défini sur le conteneur Keycloak
    location /keycloak/ {
        proxy_pass              http://keycloak:8080/keycloak/;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_set_header        X-Forwarded-Port  443;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout      90s;
    }

    # ── Flutter web app (doit être en dernier) ───────────────
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";

        # Assets immuables : cache 1 an
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Taille max upload
    client_max_body_size 10M;
}
