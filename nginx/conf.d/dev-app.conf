# ────────────────────────────────────────────────────────────
# dev.app.lucaslopvet.fr  →  Flutter web (branche dev)
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name dev.app.lucaslopvet.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.app.lucaslopvet.fr;

    ssl_certificate     /etc/letsencrypt/live/dev.app.lucaslopvet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.app.lucaslopvet.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/flutter-app-dev;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers Flutter à noms FIXES : revalidation seulement (no-cache, jamais
    # no-store) sinon un déploiement n'est jamais détecté par le navigateur.
    location ~* ^/(main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # Assets réellement immuables (CanvasKit, polices/manifests Flutter) : cache 1 an.
    location ~* ^/(canvaskit|assets)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/wasm application/json image/svg+xml;
}
