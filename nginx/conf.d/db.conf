# ────────────────────────────────────────────────────────────
# DB.lucaslopvet.fr  →  db-service (production, port 3002)
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name DB.lucaslopvet.fr db.lucaslopvet.fr;
    return 301 https://DB.lucaslopvet.fr$request_uri;
}

server {
    listen 443 ssl;
    server_name DB.lucaslopvet.fr db.lucaslopvet.fr;

    ssl_certificate     /etc/letsencrypt/live/DB.lucaslopvet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DB.lucaslopvet.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Dashboard debug accessible à la racine
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API données
    location /api/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
