# ────────────────────────────────────────────────────────────
# DB.lucaslopvet.fr  →  db-service (production, port 3002)
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name DB.lucaslopvet.fr db.lucaslopvet.fr;
    return 301 https://DB.lucaslopvet.fr$request_uri;
}

server {
    listen 443 ssl;
    server_name DB.lucaslopvet.fr db.lucaslopvet.fr;

    ssl_certificate     /etc/letsencrypt/live/DB.lucaslopvet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DB.lucaslopvet.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Doit couvrir le pire cas Multer : /documents accepte jusqu'à 5 fichiers
    # × 10 Mo (photoUpload/documentUpload dans db-service/src/middleware/upload.js),
    # soit 50 Mo en une requête. Sans marge suffisante, Nginx renvoie un 413
    # avant même d'atteindre Node, sans en-têtes CORS (le navigateur masque
    # alors le vrai 413 derrière une erreur CORS trompeuse).
    client_max_body_size 60M;

    # Dashboard debug accessible à la racine
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API données
    location /api/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
