# ============================================================
# DÉVELOPPEMENT — dev.app.lucaslopvet.fr / dev.auth.lucaslopvet.fr / dev.DB.lucaslopvet.fr
# ============================================================
services:

  auth-service-dev:
    build: ./auth-service
    container_name: auth-service-dev
    restart: unless-stopped
    ports:
      - "3003:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_PATH: /data/auth.db
      DB_SERVICE_URL: http://db-service-dev:3002
      INTERNAL_SECRET: ${INTERNAL_SECRET_DEV:-kabutare-internal-dev-secret}
      # iss réel émis par Keycloak (frontendUrl stockée en DB = dev.keycloak)
      KC_ISSUER: https://dev.keycloak.lucaslopvet.fr/realms/kabutare-hospital
      KC_JWKS_URI: https://keycloak.lucaslopvet.fr/realms/kabutare-hospital/protocol/openid-connect/certs
      KC_REALM: kabutare-hospital
      KC_ADMIN_URL: http://keycloak-dev:8081
      KC_CLIENT_ID: auth-service
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET_AUTH_DEV:-changeme-auth-service-secret}
    volumes:
      - auth_data_dev:/data
    extra_hosts:
      - "keycloak.lucaslopvet.fr:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db-service-dev:
    build: ./db-service
    container_name: db-service-dev
    restart: unless-stopped
    ports:
      - "3004:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      DB_PATH: /data/hospital.db
      AUTH_SERVICE_URL: http://auth-service-dev:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET_DEV:-kabutare-internal-dev-secret}
      # iss réel émis par Keycloak (frontendUrl stockée en DB = dev.keycloak)
      KC_ISSUER: https://dev.keycloak.lucaslopvet.fr/realms/kabutare-hospital
      KC_JWKS_URI: https://keycloak.lucaslopvet.fr/realms/kabutare-hospital/protocol/openid-connect/certs
      # Web Push VAPID (mêmes clés que prod si disponibles, sinon vides)
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT:     ${VAPID_CONTACT:-mailto:admin@lucaslopvet.fr}
    volumes:
      - db_data_dev:/data
    extra_hosts:
      - "keycloak.lucaslopvet.fr:host-gateway"
    depends_on:
      auth-service-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  keycloak-dev:
    build: ./keycloak
    container_name: keycloak-dev
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
      KC_HOSTNAME: https://dev.keycloak.lucaslopvet.fr
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # ── Brevo SMTP (utilisées par keycloak/scripts/configure-realm.sh via kcadm) ──
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME}
    ports:
      - "8081:8081"
    volumes:
      - keycloak_data_dev:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 2>/dev/null && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 3 cat <&3 | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  auth_data_dev:
    name: auth_data_dev
  db_data_dev:
    name: db_data_dev
  keycloak_data_dev:
    name: keycloak_data_dev
