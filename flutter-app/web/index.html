<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="equipment_management">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>equipment_management</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // ── Helpers Web Push — appelés depuis Dart via dart:js_interop ───────────
    //
    // En production, les handlers push sont fusionnés dans flutter_service_worker.js
    // par le pipeline CI (cat push_sw.js >> flutter_service_worker.js).
    // On utilise donc navigator.serviceWorker.ready pour obtenir le SW actif
    // (Flutter's SW + nos handlers) sans enregistrement séparé.
    //
    // En développement local (flutter run -d chrome), le SW Flutter debug est
    // actif. Pour tester les push en local, builder en --release ou utiliser
    // Chrome DevTools → Application → Service Workers → Push.

    window.requestPushPermission = async function() {
      return await Notification.requestPermission();
    };

    window.getPushPermission = function() {
      return Notification.permission;
    };

    window.subscribeToPush = async function(vapidPublicKey) {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;

        // Attend le SW actif (flutter_service_worker.js fusionné avec push_sw.js)
        const reg = await navigator.serviceWorker.ready;

        // Convertit la clé VAPID base64url en Uint8Array (requis par pushManager)
        const key = vapidPublicKey.replace(/-/g, '+').replace(/_/g, '/');
        const raw = atob(key);
        const keyBytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) keyBytes[i] = raw.charCodeAt(i);

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: keyBytes,
        });
        return JSON.stringify(sub.toJSON());
      } catch (e) {
        console.warn('[Push] subscribeToPush échoué :', e);
        return null;
      }
    };

    window.unsubscribeFromPush = async function() {
      try {
        if (!('serviceWorker' in navigator)) return;
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (sub) await sub.unsubscribe();
      } catch (_) { /* silencieux */ }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
