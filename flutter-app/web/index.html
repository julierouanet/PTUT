<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestion des équipements médicaux — Hôpital de Kabutare">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kabutare">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hôpital de Kabutare</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ── Écran de chargement — couleurs identiques à AppTheme ───────────── */
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: #F9FAFB; }

    #k-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F9FAFB;
      z-index: 9999;
      transition: opacity .4s ease;
      gap: 0;
    }
    #k-loading.k-fade { opacity: 0; }

    /* Logo hôpital */
    .k-icon {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .k-icon img { width: 80px; height: 80px; object-fit: contain; }

    /* Textes */
    .k-title {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: #111827;
      letter-spacing: .01em;
      margin-bottom: 4px;
    }
    .k-sub {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      font-size: .78rem;
      color: #6B7280;
      margin-bottom: 28px;
    }

    /* Barre de progression */
    .k-track {
      width: 220px;
      height: 4px;
      background: #E5E7EB;
      border-radius: 99px;
      overflow: hidden;
    }
    #k-bar {
      height: 100%;
      width: 0%;
      background: #2563EB;
      border-radius: 99px;
      transition: width .25s ease;
    }

    /* Pourcentage */
    #k-pct {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      font-size: .75rem;
      color: #9CA3AF;
      margin-top: 10px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <!-- ── Écran de chargement (retiré dès le 1er frame Flutter) ─────────── -->
  <div id="k-loading">
    <div class="k-icon">
      <img src="icons/Icon-192.png" alt="Logo Hôpital de Kabutare">
    </div>
    <div class="k-title">Hôpital de Kabutare</div>
    <div class="k-sub">Gestion des équipements médicaux</div>
    <div class="k-track"><div id="k-bar"></div></div>
    <div id="k-pct">0%</div>
  </div>

  <script>
    // ── Progression du chargement ─────────────────────────────────────────
    (function () {
      var bar  = document.getElementById('k-bar');
      var pct  = document.getElementById('k-pct');
      var scr  = document.getElementById('k-loading');
      var cur  = 0;
      var raf;

      function setProgress(p) {
        cur = Math.min(Math.max(p, cur), 99); // n'avance jamais en arrière
        bar.style.width = cur + '%';
        pct.textContent  = Math.round(cur) + '%';
      }

      // ── Progression animée (courbe ease-out) jusqu'à ~90 % ─────────────
      // Va vite au début (0→60 % en ~2 s), puis ralentit pour attendre Flutter.
      var t0 = performance.now();
      var DURATION = 7000; // ms pour atteindre 90 %

      function tick(now) {
        var t = Math.min((now - t0) / DURATION, 1);
        // ease-out cubique
        var eased = 1 - Math.pow(1 - t, 3);
        setProgress(eased * 90);
        if (cur < 89) raf = requestAnimationFrame(tick);
      }
      raf = requestAnimationFrame(tick);

      // ── Tentative de progression réelle via fetch ─────────────────────
      // Si le serveur envoie Content-Length (sans chunked), on lit les octets réels.
      var _fetch = window.fetch;
      var totalBytes = 0, loadedBytes = 0;
      window.fetch = function (resource, opts) {
        var url = typeof resource === 'string' ? resource : (resource && resource.url) || '';
        var isMain = /main\.dart(\.js)?$/.test(url);
        var p = _fetch.apply(this, arguments);
        if (!isMain) return p;
        return p.then(function (resp) {
          var cl = parseInt(resp.headers.get('content-length') || '0', 10);
          if (!cl) return resp; // chunked/gzip sans longueur → garder la simulation
          totalBytes += cl;
          var reader = resp.body.getReader();
          var stream = new ReadableStream({
            start: function (ctrl) {
              function pump() {
                reader.read().then(function (r) {
                  if (r.done) { ctrl.close(); return; }
                  loadedBytes += r.value.length;
                  setProgress(totalBytes ? (loadedBytes / totalBytes) * 85 : cur);
                  ctrl.enqueue(r.value);
                  pump();
                }).catch(function (e) { ctrl.error(e); });
              }
              pump();
            }
          });
          return new Response(stream, {
            status: resp.status, statusText: resp.statusText, headers: resp.headers
          });
        });
      };

      // ── Fin du chargement : Flutter a rendu son 1er frame ────────────
      window.addEventListener('flutter-first-frame', function () {
        cancelAnimationFrame(raf);
        setProgress(100);
        bar.style.transition = 'width .15s ease';
        pct.textContent = '100%';
        setTimeout(function () {
          scr.classList.add('k-fade');
          setTimeout(function () { scr.style.display = 'none'; }, 420);
        }, 200);

        // ── Enregistrement du SW après Flutter (mécanisme déprecié dans les nouvelles versions) ──
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            if (regs.length === 0) {
              // Flutter n'a pas enregistré de SW — on le fait ici en fallback
              navigator.serviceWorker.register('/flutter_service_worker.js')
                .then(function(reg) { console.log('[SW] Enregistré :', reg.scope); })
                .catch(function(err) { console.warn('[SW] Erreur :', err); });
            }
          });
        }
      });
    })();

    // ── Helpers Web Push — appelés depuis Dart via dart:js_interop ─────────
    //
    // En production, les handlers push sont fusionnés dans flutter_service_worker.js
    // par le pipeline CI (cat push_sw.js >> flutter_service_worker.js).
    // On utilise donc navigator.serviceWorker.ready pour obtenir le SW actif
    // (Flutter's SW + nos handlers) sans enregistrement séparé.
    //
    // En développement local (flutter run -d chrome), le SW Flutter debug est
    // actif. Pour tester les push en local, builder en --release ou utiliser
    // Chrome DevTools → Application → Service Workers → Push.

    window.requestPushPermission = async function() {
      return await Notification.requestPermission();
    };

    window.getPushPermission = function() {
      return Notification.permission;
    };

    window.subscribeToPush = async function(vapidPublicKey) {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;

        // Attend le SW actif (flutter_service_worker.js fusionné avec push_sw.js)
        const reg = await navigator.serviceWorker.ready;

        // Convertit la clé VAPID base64url en Uint8Array (requis par pushManager)
        const key = vapidPublicKey.replace(/-/g, '+').replace(/_/g, '/');
        const raw = atob(key);
        const keyBytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) keyBytes[i] = raw.charCodeAt(i);

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: keyBytes,
        });
        return JSON.stringify(sub.toJSON());
      } catch (e) {
        console.warn('[Push] subscribeToPush échoué :', e);
        return null;
      }
    };

    window.unsubscribeFromPush = async function() {
      try {
        if (!('serviceWorker' in navigator)) return;
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (sub) await sub.unsubscribe();
      } catch (_) { /* silencieux */ }
    };

    // ── Détection environnement Push (iOS, mode standalone, support, permission) ──
    // Sur iOS/Safari, PushManager n'existe que si le site est installé en PWA
    // (« Ajouter à l'écran d'accueil », mode standalone, iOS >= 16.4).
    window.getPushEnvironment = function() {
      const ua = navigator.userAgent;
      const isIphoneIpod = /iPhone|iPod/.test(ua) && !window.MSStream;
      const isIpad = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isIos = isIphoneIpod || isIpad;
      const isStandalone = window.navigator.standalone === true
        || window.matchMedia('(display-mode: standalone)').matches;
      const pushSupported = ('serviceWorker' in navigator) && ('PushManager' in window);
      const permissionState = ('Notification' in window) ? window.getPushPermission() : 'unsupported';
      return JSON.stringify({ isIos, isStandalone, pushSupported, permissionState });
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
