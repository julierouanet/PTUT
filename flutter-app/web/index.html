<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="equipment_management">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>equipment_management</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // ── Enregistrement du Service Worker push ─────────────────────────────────
    // Distinct du flutter_service_worker.js — gère uniquement les notifications push.
    if ('serviceWorker' in navigator && 'PushManager' in window) {
      navigator.serviceWorker.register('/push_sw.js').then(function(reg) {
        window._pushSW = reg;
      }).catch(function(e) {
        console.warn('[Push SW] Erreur enregistrement :', e);
      });
    }

    // ── Helpers appelés depuis Dart via dart:js ───────────────────────────────

    window.requestPushPermission = async function() {
      return await Notification.requestPermission();
    };

    window.getPushPermission = function() {
      return Notification.permission;
    };

    window.subscribeToPush = async function(vapidPublicKey) {
      try {
        const reg = window._pushSW || await navigator.serviceWorker.ready;
        // Convertit la clé VAPID base64url en Uint8Array (requis par pushManager)
        const key = vapidPublicKey.replace(/-/g, '+').replace(/_/g, '/');
        const raw = atob(key);
        const keyBytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) keyBytes[i] = raw.charCodeAt(i);

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: keyBytes,
        });
        return JSON.stringify(sub.toJSON());
      } catch (e) {
        console.warn('[Push] subscribeToPush échoué :', e);
        return null;
      }
    };

    window.unsubscribeFromPush = async function() {
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (sub) await sub.unsubscribe();
      } catch (e) { /* silencieux */ }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
