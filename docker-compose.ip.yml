# ============================================================
# Déploiement IP-only — images depuis Docker Hub
# Usage : docker compose -f docker-compose.ip.yml up -d
# Pré-requis : fichier .env renseigné (voir .env.ip.example)
#              certificat SSL dans ./ssl/cert.pem et ./ssl/key.pem
#              (généré par setup_ubuntu.sh — scp n'est pas nécessaire)
# ============================================================

# ── Réseaux cloisonnés (principe du moindre privilège) ──────
# frontend   : nginx  ↔  auth-service, db-service
# backend    : auth-service / db-service  ↔  keycloak (JWKS, Admin API)
# keycloak_db: keycloak  ↔  postgres uniquement — inaccessible des services Node
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  keycloak_db:
    driver: bridge

# ── Configuration de logging commune ────────────────────────
# Rotation automatique : 3 fichiers × 10 Mo max = 30 Mo par service
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Nginx : HTTPS front, routing par chemin ───────────────
  # L'image embarque le build Flutter (placeholder __SERVER_IP__).
  # SERVER_IP est remplacé au démarrage par docker-entrypoint-ip.sh.
  nginx:
    image: ${DOCKER_USER}/kabutare-nginx:${APP_VERSION:-latest}
    container_name: nginx-ip
    restart: unless-stopped
    environment:
      SERVER_IP: ${SERVER_IP}
    ports:
      # HTTP et HTTPS : écoute sur toutes interfaces (accès public voulu)
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d/ip.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/keycloak-loading.html:/usr/share/nginx/html/keycloak-loading.html:ro
    networks:
      - frontend   # nginx accède à auth-service et db-service uniquement
    depends_on:
      auth-service:
        condition: service_healthy
      db-service:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # écouter sur les ports 80 / 443
      - CHOWN              # nginx ajuste l'ownership de ses fichiers temporaires
      - SETUID             # le master process passe au worker process
      - SETGID
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # ── Auth service ──────────────────────────────────────────
  auth-service:
    image: ${DOCKER_USER}/kabutare-auth-service:${APP_VERSION:-latest}
    container_name: auth-service-ip
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_PATH: /data/auth.db
      DB_SERVICE_URL: http://db-service:3002
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      # Keycloak — issuer = URL externe (dans le JWT), JWKS = URL interne HTTP
      # KC_PUBLIC_URL est défini dans .env sans :443 si port standard (Keycloak normalise l'URL)
      KC_ISSUER:      ${KC_PUBLIC_URL}/keycloak/realms/kabutare-hospital
      KC_JWKS_URI:    http://keycloak:8080/keycloak/realms/kabutare-hospital/protocol/openid-connect/certs
      KC_REALM:       kabutare-hospital
      KC_ADMIN_URL:   http://keycloak:8080/keycloak
      KC_CLIENT_ID:   auth-service
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET_AUTH}
      # CORS — origines autorisées : IP publique + IP locale WiFi hôpital (comma-separated)
      # Exemple : "https://41.186.x.x,https://192.168.1.100"
      CORS_ORIGIN:    ${CORS_ORIGIN:-https://${SERVER_IP}}
      BREVO_API_KEY:  ${BREVO_API_KEY:-}
    volumes:
      - auth_data_ip:/data
    networks:
      - frontend     # accessible depuis nginx
      - backend      # peut atteindre keycloak (JWKS + Admin API)
    # Pas de `ports:` — accessible uniquement via nginx sur le réseau frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      keycloak:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging: *default-logging

  # ── DB service ────────────────────────────────────────────
  db-service:
    image: ${DOCKER_USER}/kabutare-db-service:${APP_VERSION:-latest}
    container_name: db-service-ip
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: production
      DB_PATH: /data/hospital.db
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      KC_ISSUER:   ${KC_PUBLIC_URL}/keycloak/realms/kabutare-hospital
      KC_JWKS_URI: http://keycloak:8080/keycloak/realms/kabutare-hospital/protocol/openid-connect/certs
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${SERVER_IP}}
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT:     ${VAPID_CONTACT:-mailto:admin@hospital.local}
      BREVO_API_KEY:     ${BREVO_API_KEY:-}
    volumes:
      - db_data_ip:/data
    networks:
      - frontend     # accessible depuis nginx
      - backend      # peut atteindre keycloak (JWKS)
    # Pas de `ports:` — accessible uniquement via nginx sur le réseau frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      auth-service:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging: *default-logging

  # ── PostgreSQL (backend Keycloak) ─────────────────────────
  # ISOLÉ sur le réseau keycloak_db : aucun autre service (nginx, auth, db) ne peut l'atteindre
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak-ip
    restart: unless-stopped
    environment:
      POSTGRES_DB:       keycloak
      POSTGRES_USER:     keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      # scram-sha-256 remplace md5 (obsolète) pour l'authentification réseau PostgreSQL
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    volumes:
      - keycloak_postgres_data_ip:/var/lib/postgresql/data
    networks:
      - keycloak_db   # UNIQUEMENT keycloak peut l'atteindre
    # Pas de `ports:` — inaccessible hors du réseau keycloak_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID        # postgres passe du processus maître au worker
      - SETGID
      - CHOWN         # ownership des fichiers de données
      - FOWNER
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
    logging: *default-logging

  # ── Keycloak ──────────────────────────────────────────────
  # Accessible via Nginx à https://${SERVER_IP}/keycloak/
  # Admin UI : https://${SERVER_IP}/keycloak/admin/
  keycloak:
    image: ${DOCKER_USER}/kabutare-keycloak:${APP_VERSION:-latest}
    container_name: keycloak-ip
    restart: unless-stopped
    command: start
    environment:
      KC_DB:          postgres
      KC_DB_URL:      jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # URL externe (ce que Keycloak met dans le claim "iss" des tokens)
      # Doit correspondre exactement à KC_ISSUER sans le chemin /realms/...
      KC_HOSTNAME:           ${KC_PUBLIC_URL}/keycloak
      KC_HTTP_ENABLED:       "true"
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY_HEADERS:      xforwarded
      # Variables bootstrap Keycloak 26+ (KEYCLOAK_ADMIN* est déprécié depuis KC 26)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Brevo SMTP (optionnel pour IP-only, laisser vide si pas d'email)
      BREVO_SMTP_HOST:     ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT:     ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_LOGIN:    ${BREVO_SMTP_LOGIN:-}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD:-}
      BREVO_FROM_EMAIL:    ${BREVO_FROM_EMAIL:-noreply@hospital.local}
      BREVO_FROM_NAME:     "${BREVO_FROM_NAME:-Hôpital de Kabutare}"
      KC_HEALTH_ENABLED:   "true"
      # Contraintes JVM heap explicites pour éviter l'OOM-kill au premier boot
      # (Keycloak compile un serveur optimisé au 1er démarrage — pic mémoire ~1-1.2 GB)
      JAVA_OPTS_APPEND: "-Xms256m -Xmx768m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256M"
    ports:
      # Lié à 127.0.0.1 uniquement : accès SSH tunnel ou Nginx interne — pas d'exposition publique
      - "127.0.0.1:${KC_HOST_PORT:-8080}:8080"
    networks:
      - backend      # auth-service et db-service peuvent l'atteindre (JWKS, Admin API)
      - keycloak_db  # peut atteindre postgres-keycloak
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      # L'image Keycloak 26 (Red Hat UBI Minimal) n'embarque NI curl NI wget.
      # On utilise bash /dev/tcp (built-in, toujours disponible) pour ouvrir une
      # connexion TCP sur le port 9000 (management interface Keycloak 26+).
      # Ce port s'ouvre uniquement quand Keycloak a fini son init (DB + realm).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    # cap_drop intentionnellement absent : la JVM OpenJDK (Red Hat UBI) a des besoins
    # en capacités Linux difficiles à prévoir (perfmon, memory mapping, etc.).
    # no-new-privileges suffit comme protection — Keycloak tourne déjà en user 1000.
    deploy:
      resources:
        limits:
          memory: 1536M   # 1.5 GB — pic au 1er boot (compilation) + steady state ~600 MB
          cpus: "1.0"
        reservations:
          memory: 512M
    logging: *default-logging

volumes:
  auth_data_ip:
  db_data_ip:
  keycloak_postgres_data_ip:
