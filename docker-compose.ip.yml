# ============================================================
# Déploiement IP-only — images depuis Docker Hub
# Usage : docker compose -f docker-compose.ip.yml up -d
# Pré-requis : fichier .env renseigné (voir .env.ip.example)
#              certificat SSL dans ./ssl/cert.pem et ./ssl/key.pem
#              (généré par setup_ubuntu.sh — scp n'est pas nécessaire)
# ============================================================
services:

  # ── Nginx : HTTPS front, routing par chemin ───────────────
  # L'image embarque le build Flutter (placeholder __SERVER_IP__).
  # SERVER_IP est remplacé au démarrage par docker-entrypoint-ip.sh.
  nginx:
    image: ${DOCKER_USER}/kabutare-nginx:latest
    container_name: nginx-ip
    restart: unless-stopped
    environment:
      SERVER_IP: ${SERVER_IP}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth-service
      - db-service

  # ── Auth service ──────────────────────────────────────────
  auth-service:
    image: ${DOCKER_USER}/kabutare-auth-service:latest
    container_name: auth-service-ip
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_PATH: /data/auth.db
      DB_SERVICE_URL: http://db-service:3002
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      # Keycloak — issuer = URL externe (dans le JWT), JWKS = URL interne HTTP
      KC_ISSUER:      https://${SERVER_IP}:${HTTPS_PORT:-443}/keycloak/realms/kabutare-hospital
      KC_JWKS_URI:    http://keycloak:8080/keycloak/realms/kabutare-hospital/protocol/openid-connect/certs
      KC_REALM:       kabutare-hospital
      KC_ADMIN_URL:   http://keycloak:8080/keycloak
      KC_CLIENT_ID:   auth-service
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET_AUTH}
      # CORS — origine de l'application Flutter sur l'IP du serveur
      CORS_ORIGIN:    https://${SERVER_IP}
      BREVO_API_KEY:  ${BREVO_API_KEY:-}
    volumes:
      - auth_data_ip:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      keycloak:
        condition: service_healthy

  # ── DB service ────────────────────────────────────────────
  db-service:
    image: ${DOCKER_USER}/kabutare-db-service:latest
    container_name: db-service-ip
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: production
      DB_PATH: /data/hospital.db
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      KC_ISSUER:   https://${SERVER_IP}:${HTTPS_PORT:-443}/keycloak/realms/kabutare-hospital
      KC_JWKS_URI: http://keycloak:8080/keycloak/realms/kabutare-hospital/protocol/openid-connect/certs
      CORS_ORIGIN: https://${SERVER_IP}
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT:     ${VAPID_CONTACT:-mailto:admin@hospital.local}
      BREVO_API_KEY:     ${BREVO_API_KEY:-}
    volumes:
      - db_data_ip:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      auth-service:
        condition: service_healthy

  # ── PostgreSQL (backend Keycloak) ─────────────────────────
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak-ip
    restart: unless-stopped
    environment:
      POSTGRES_DB:       keycloak
      POSTGRES_USER:     keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_postgres_data_ip:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak ──────────────────────────────────────────────
  # Accessible via Nginx à https://${SERVER_IP}/keycloak/
  # Admin UI : https://${SERVER_IP}/keycloak/admin/
  keycloak:
    image: ${DOCKER_USER}/kabutare-keycloak:latest
    container_name: keycloak-ip
    restart: unless-stopped
    command: start
    environment:
      KC_DB:          postgres
      KC_DB_URL:      jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # URL externe (ce que Keycloak met dans le claim "iss" des tokens)
      KC_HOSTNAME:           https://${SERVER_IP}:${HTTPS_PORT:-443}/keycloak
      KC_HTTP_ENABLED:       "true"
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY_HEADERS:      xforwarded
      KEYCLOAK_ADMIN:         ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Brevo SMTP (optionnel pour IP-only, laisser vide si pas d'email)
      BREVO_SMTP_HOST:     ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT:     ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_LOGIN:    ${BREVO_SMTP_LOGIN:-}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD:-}
      BREVO_FROM_EMAIL:    ${BREVO_FROM_EMAIL:-noreply@hospital.local}
      BREVO_FROM_NAME:     "${BREVO_FROM_NAME:-Hôpital de Kabutare}"
      KC_HEALTH_ENABLED:   "true"
    # Port exposé uniquement en localhost — accès via Nginx (HTTPS) ou SSH tunnel
    ports:
      - "127.0.0.1:${KC_HOST_PORT:-8080}:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  auth_data_ip:
  db_data_ip:
  keycloak_postgres_data_ip:
