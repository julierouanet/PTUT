# ============================================================
# PRODUCTION — app.lucaslopvet.fr / auth.lucaslopvet.fr / DB.lucaslopvet.fr
# ============================================================
services:

  auth-service:
    build: ./auth-service
    container_name: auth-service-prod
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_PATH: /data/auth.db
      # Conservé pour le shim de transition (supprimer en Phase 5)
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DB_SERVICE_URL: http://db-service:3002
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      # Keycloak
      KC_ISSUER: https://keycloak.lucaslopvet.fr/realms/kabutare-hospital
      KC_REALM: kabutare-hospital
      KC_ADMIN_URL: https://keycloak.lucaslopvet.fr
      KC_CLIENT_ID: auth-service
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET_AUTH}
    volumes:
      - auth_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db-service:
    build: ./db-service
    container_name: db-service-prod
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      DB_PATH: /data/hospital.db
      # Conservé pour le shim de transition (supprimer en Phase 5)
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      # Keycloak
      KC_ISSUER: https://keycloak.lucaslopvet.fr/realms/kabutare-hospital
    volumes:
      - db_data:/data
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-prod
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: keycloak.lucaslopvet.fr
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  auth_data:
    name: auth_data_prod
  db_data:
    name: db_data_prod
  keycloak_postgres_data:
    name: keycloak_postgres_data_prod
