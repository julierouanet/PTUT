# ============================================================
# PRODUCTION — app.lucaslopvet.fr / auth.lucaslopvet.fr / DB.lucaslopvet.fr
# ============================================================
services:

  auth-service:
    build: ./auth-service
    container_name: auth-service-prod
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_PATH: /data/auth.db
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    volumes:
      - auth_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db-service:
    build: ./db-service
    container_name: db-service-prod
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      DB_PATH: /data/hospital.db
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
    volumes:
      - db_data:/data
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  auth_data:
    name: auth_data_prod
  db_data:
    name: db_data_prod
